<style>/* Critical CSS — inline for instant first paint */
/*
 * Critical CSS — 首屏布局核心样式（内联用）
 * 只包含 layout-defining rules，排除 hover/transition/animation/modal
 * 约 4KB 内联到 <head>，确保 FCP 时布局就正确
 */
:root {
  --primary: #5b4af5; --primary-dark: #4338ca; --primary-light: #ede9fe;
  --primary-soft: #f5f3ff; --accent: #ec4899; --text: #1e1e2e;
  --text-secondary: #555; --text-muted: #999; --bg: #f8f9fb;
  --card-bg: #fff; --border: #e8eaee; --border-light: #f0f1f3;
  --shadow: 0 1px 3px rgba(0,0,0,.04); --shadow-md: 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.08);
  --radius: 14px; --radius-sm: 8px; --radius-lg: 18px; --radius-pill: 100px;
  --transition: .2s ease; --sidebar-width: 220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text);background:#f5f6fa;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;border:none;outline:none}
img{display:block;max-width:100%}

/* Sidebar */
.sidebar{
  position:fixed;top:60px;left:0;bottom:0;
  width:var(--sidebar-width);background:#fff;
  border-right:1px solid var(--border-light);z-index:100;
  display:flex;flex-direction:column;overflow-y:auto;
}
.sidebar-nav{flex:1;padding:12px 0 8px}
.sidebar-link{
  display:flex;align-items:center;gap:8px;padding:9px 20px;
  font-size:13.5px;color:var(--text-secondary);width:100%;text-align:left;
  border-left:3px solid transparent;
}
.sidebar-link.active{
  background:var(--primary-soft);color:var(--primary);font-weight:600;
  border-left-color:var(--primary);
}
.sidebar-link .sidebar-badge{
  margin-left:auto;font-size:11px;color:var(--text-muted);
  background:#f3f4f6;padding:1px 8px;border-radius:10px;font-weight:500;
}
.sidebar-link.active .sidebar-badge{background:var(--primary-light);color:var(--primary-dark)}
.sidebar-footer{
  padding:14px 20px;font-size:12px;color:var(--text-muted);
  border-top:1px solid var(--border-light);text-align:center;flex-shrink:0;
}

/* Main Wrapper */
.main-wrapper{
  flex:1;margin-left:var(--sidebar-width);
  display:flex;flex-direction:column;min-height:100vh;
}

/* Header */
.header{
  position:sticky;top:0;z-index:200;
  background:rgba(255,255,255,.85);backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  /* border-bottom:1px solid rgba(0,0,0,.06); */box-shadow:0 1px 8px rgba(0,0,0,.04);
}
.header-inner{
  padding:0 28px;height:60px;display:flex;align-items:center;gap:8px;
  max-width:1500px;margin:0 auto;
}
.sidebar-toggle{
  display:none;width:36px;height:36px;align-items:center;justify-content:center;
  border-radius:8px;color:var(--text-secondary);flex-shrink:0;margin-right:2px;
}
.header-logo{display:flex;align-items:center;gap:10px;margin-right:32px;flex-shrink:0}
.header-logo-svg{height:40px;flex-shrink:0;object-fit:contain;width:auto}
.header-logo-text{
  font-size:17px;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-logo-domain{font-size:11px;color:var(--text-muted);margin-left:-4px;margin-top:2px;align-self:flex-end;padding-bottom:2px}
.header-nav{display:flex;gap:2px;flex-wrap:wrap}
.header-nav a{padding:6px 15px;border-radius:8px;font-size:13.5px;color:var(--text-secondary);white-space:nowrap}
.header-nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-btn{padding:7px 18px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
.header-submit{background:var(--primary);color:#fff}

/* Hero */
.hero{
  position:relative;min-height:320px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:linear-gradient(160deg,#0a0e27 0%,#12133d 30%,#1a1040 60%,#0f1a35 100%);
}
.hero-inner{position:relative;z-index:2;text-align:center;max-width:700px;padding:40px 28px 44px}
.hero-title{font-size:42px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1.2;margin-bottom:10px}
.hero-title-accent{
  background:linear-gradient(135deg,#818cf8 0%,#c084fc 40%,#f472b6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-subtitle{font-size:15px;color:rgba(255,255,255,.5);margin-bottom:32px}

/* Search */
.search-card{max-width:620px;margin:0 auto;padding:0}
.search-tabs{display:flex;justify-content:center;gap:4px;margin-bottom:14px}
.search-tab{
  padding:6px 18px;border-radius:var(--radius-pill);font-size:12.5px;
  color:rgba(255,255,255,.5);background:transparent;
}
.search-tab.active{background:rgba(99,102,241,.35);color:#fff;font-weight:600}
.search-box{position:relative}
.search-box input{
  width:100%;height:52px;padding:0 54px 0 46px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
  font-size:14.5px;color:#fff;
}
.search-box input::placeholder{color:rgba(255,255,255,.35)}
.search-box-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);pointer-events:none}
.search-btn{
  position:absolute;right:5px;top:5px;width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.hot-tags{margin-top:18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}
.hot-tag{
  padding:5px 15px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;
  color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
}

/* Content */
.main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:28px 28px 48px}

/* Category */
.category-section{margin-bottom:36px;padding:0}
.category-section[style*="display:none"]{display:none!important}
.cat-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border-light)}
.cat-icon-box{
  width:28px;height:28px;border-radius:var(--radius-sm);background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.cat-name{font-size:17px;font-weight:700;color:var(--text)}
.cat-count{font-size:12px;font-weight:500;color:var(--text-muted);margin-left:auto}

/* Links Grid */
.links-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}

/* Link Card (layout only) */
.link-card{
  display:flex;align-items:flex-start;gap:12px;padding:16px 14px;
  background:var(--card-bg);border-radius:10px;border:none;position:relative;overflow:hidden;
}
.link-logo,.link-logo-link{
  flex-shrink:0;width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-size:16px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.link-logo-link{cursor:pointer}
.link-logo img,.link-logo-link img{width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;border-radius:10px}
.link-logo .logo-text,.link-logo-link .logo-text{line-height:1;font-size:15px}
.link-body{flex:1;min-width:0}
.link-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-desc{font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.link-badges{display:flex;flex-wrap:wrap;gap:4px}

/* Badge */
.badge{
  display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);
  font-size:10.5px;font-weight:600;line-height:1.6;letter-spacing:.3px;
  border:1px solid transparent;text-transform:uppercase;
}
.badge-hot{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.badge-rec{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.badge-cn{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.badge-en{background:#fefce8;color:#ca8a04;border-color:#fde68a}
.badge-new{background:#fdf2f8;color:#db2777;border-color:#fbcfe8}

/* Footer */
.footer{background:var(--card-bg);/* border-top:1px solid var(--border-light); */padding:28px;margin-top:auto}
.footer-inner{max-width:1300px;margin:0 auto;text-align:center;font-size:13px;color:var(--text-muted)}
.footer-inner strong{color:var(--primary)}
.footer-desc{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.footer-links{display:flex;gap:20px;justify-content:center;margin-top:6px;flex-wrap:wrap;align-items:center}
.footer-links a{color:var(--text-secondary);font-size:13px}

/* Scroll top */
.scroll-top{
  position:fixed;bottom:32px;right:32px;z-index:99;
  width:44px;height:44px;border-radius:50%;
  background:var(--card-bg);box-shadow:var(--shadow-md);
  color:var(--text-secondary);display:flex;align-items:center;justify-content:center;
}

/* Sidebar Overlay */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190;
}
.sidebar-overlay.show{display:block}

/* Submit button */
.submit-site-btn{
  display:block;width:100%;margin-top:10px;padding:8px 0;
  background:var(--primary);color:#fff;border-radius:8px;font-size:13px;font-weight:600;
}

/* Language switcher */
.lang-switcher{position:relative}
.lang-switch-btn{
  display:inline-flex;align-items:center;gap:6px;background:transparent;
  border:1px solid var(--border-light);border-radius:8px;
  padding:5px 10px 5px 8px;font-size:13px;color:#1d1d1f;cursor:pointer;
}
.lang-globe{width:16px;height:16px;flex-shrink:0;color:var(--text-secondary)}
.lang-switch-label{line-height:1}
.lang-arrow{width:12px;height:12px;flex-shrink:0;color:var(--text-muted)}
.lang-dropdown{
  display:none;position:absolute;top:100%;right:0;margin-top:6px;
  min-width:120px;background:var(--card-bg);border:1px solid var(--border-light);
  border-radius:8px;box-shadow:var(--shadow-md);z-index:200;padding:4px 0;
  list-style:none;
}
.lang-switcher.open .lang-dropdown{display:block}
.lang-option{
  padding:7px 14px;font-size:13px;color:#1d1d1f;
  cursor:pointer;white-space:nowrap;
}
.lang-option.active{color:var(--primary);font-weight:600;background:rgba(91,74,245,.06)}
.lang-current-label{font-size:13px;color:var(--text-secondary);cursor:pointer;padding:6px 10px;border-radius:6px}

/* Footer language switcher — dropdown goes upward */
.footer .lang-dropdown{bottom:100%;top:auto;margin-top:0;margin-bottom:6px}
.footer .lang-switch-btn{font-size:12px;padding:4px 8px 4px 6px}
.footer .lang-globe{width:14px;height:14px}
.footer .lang-arrow{width:10px;height:10px}

/* Responsive — grid columns only */
@media(max-width:1000px){
  .links-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .sidebar-toggle{display:flex}
  .sidebar{top:0;z-index:300;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-wrapper{margin-left:0}
  .header-logo{margin-right:auto}
  .header-nav{display:none}
  .header-actions{display:none}
  .header-inner{padding:0 14px;height:52px}
}
@media(max-width:640px){
  .links-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .link-card{padding:10px 10px;gap:8px}
  .link-logo{width:36px;height:36px;border-radius:8px}
  .link-name{font-size:13px}
  .link-desc{font-size:11px;-webkit-line-clamp:1}
  .badge{font-size:9.5px;padding:1px 6px}
}
@media(max-width:600px){
  .hero{min-height:280px}
  .hero-inner{padding:24px 14px}
  .hero-title{font-size:24px}
  .hero-subtitle{font-size:12px;margin-bottom:18px}
  .search-box input{height:42px;font-size:13px;padding:0 42px 0 36px;border-radius:10px}
  .search-btn{width:34px;height:34px;top:4px;right:4px;border-radius:8px}
  .search-btn svg{width:16px;height:16px}
  .search-box-icon{left:10px;width:14px;height:14px}
  .search-tab{padding:4px 10px;font-size:11px}
  .hot-tag{padding:3px 9px;font-size:11.5px}
  .sidebar-link{padding:8px 14px;font-size:13px}
  .header-logo-svg{height:28px}
  .footer{padding:20px 16px}
  .header-inner{height:48px}
}

/* ========== Skeleton Screen ========== */
@keyframes sk-shimmer{
  0%{background-position:-400px 0}
  100%{background-position:400px 0}
}
.sk-section{margin-bottom:36px}
.sk-cat-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border-light);
}
.sk-block{
  border-radius:6px;
  background:linear-gradient(90deg,#ececec 25%,#f5f5f5 50%,#ececec 75%);
  background-size:800px 100%;
  animation:sk-shimmer 1.4s infinite linear;
}
.sk-cat-icon{width:28px;height:28px;border-radius:8px}
.sk-cat-title{height:18px;width:100px}
.sk-cat-count{height:14px;width:40px;margin-left:auto}
.sk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sk-card{
  background:#fff;border-radius:10px;padding:16px 14px;
  display:flex;align-items:flex-start;gap:12px;
}
.sk-logo{flex-shrink:0;width:44px;height:44px;border-radius:10px}
.sk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sk-name{height:14px;width:70%}
.sk-desc{height:11px;width:100%}
.sk-desc2{height:11px;width:60%}
@media(max-width:1000px){.sk-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.sk-grid{grid-template-columns:repeat(2,1fr);gap:8px}.sk-card{padding:10px}}
